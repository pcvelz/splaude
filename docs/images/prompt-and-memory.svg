<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="pm-title pm-desc">
  <title id="pm-title">Long prompts and memory</title>
  <desc id="pm-desc">A cold 60k-token prompt takes about 350 seconds on Splaude and about 780 seconds on llama.cpp. Processing speed at 60k: 177 tokens per second on Splaude, 79.6 on llama.cpp. Wired memory during the run, llama.cpp with MTP against Splaude: 32.9 against 25.1 GB at 2k context, 33.2 against 26.3 at 20k, 32.7 against 29.3 at 60k, so Splaude uses 7.8, 6.9 and 3.4 GB less.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="20" y="36" font-size="24" font-weight="800" fill="#111827">Long prompts and memory</text>
  <text x="20" y="60" font-size="13" fill="#374151">Claude Code sends large prompts: the system prompt, tool definitions and every file it has read. Processing them is where a first turn spends its time.</text>

  <!-- Cold prompt panel -->
  <rect x="20" y="80" width="450" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="108" font-size="16" font-weight="700" fill="#111827">Cold 60k-token prompt</text>
  <text x="36" y="128" font-size="12" fill="#4b5563">seconds to process the prompt, lower is better</text>
  <g font-size="12">
    <text x="124" y="163" text-anchor="end" fill="#374151">llama.cpp</text>
    <rect x="132" y="150" width="253.5" height="18" rx="3" fill="#c4c9d0"/><text x="392" y="163" font-weight="700" fill="#4b5563">~780 s</text>
    <text x="124" y="189" text-anchor="end" font-weight="700" fill="#155e75">Splaude</text>
    <rect x="132" y="176" width="113.75" height="18" rx="3" fill="#0e7490"/><text x="252" y="189" font-weight="700" fill="#155e75">~350 s</text>
  </g>
  <text x="36" y="232" font-size="12" fill="#4b5563">Processing speed at 60k: 177 tok/s on Splaude, 79.6 on llama.cpp.</text>

  <!-- Memory panel -->
  <rect x="490" y="80" width="450" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="506" y="108" font-size="16" font-weight="700" fill="#111827">Wired memory during the run</text>
  <text x="506" y="128" font-size="12" fill="#4b5563">GB, scale 0 to 35, lower is better</text>
  <text x="506" y="158" font-size="13" font-weight="700" fill="#111827">2k context</text>
  <text x="926" y="158" text-anchor="end" font-size="12" font-weight="600" fill="#155e75">7.8 GB less</text>
  <g font-size="12">
    <text x="614" y="179" text-anchor="end" fill="#374151">llama.cpp + MTP</text>
    <rect x="622" y="166" width="244.4" height="16" rx="3" fill="#8a929e"/><text x="872" y="179" font-weight="700" fill="#4b5563">32.9</text>
    <text x="614" y="201" text-anchor="end" font-weight="700" fill="#155e75">Splaude</text>
    <rect x="622" y="188" width="186.5" height="16" rx="3" fill="#0e7490"/><text x="815" y="201" font-weight="700" fill="#155e75">25.1</text>
  </g>
  <text x="506" y="236" font-size="13" font-weight="700" fill="#111827">20k context</text>
  <text x="926" y="236" text-anchor="end" font-size="12" font-weight="600" fill="#155e75">6.9 GB less</text>
  <g font-size="12">
    <text x="614" y="257" text-anchor="end" fill="#374151">llama.cpp + MTP</text>
    <rect x="622" y="244" width="246.6" height="16" rx="3" fill="#8a929e"/><text x="875" y="257" font-weight="700" fill="#4b5563">33.2</text>
    <text x="614" y="279" text-anchor="end" font-weight="700" fill="#155e75">Splaude</text>
    <rect x="622" y="266" width="195.4" height="16" rx="3" fill="#0e7490"/><text x="824" y="279" font-weight="700" fill="#155e75">26.3</text>
  </g>
  <text x="506" y="314" font-size="13" font-weight="700" fill="#111827">60k context</text>
  <text x="926" y="314" text-anchor="end" font-size="12" font-weight="600" fill="#155e75">3.4 GB less</text>
  <g font-size="12">
    <text x="614" y="335" text-anchor="end" fill="#374151">llama.cpp + MTP</text>
    <rect x="622" y="322" width="242.9" height="16" rx="3" fill="#8a929e"/><text x="871" y="335" font-weight="700" fill="#4b5563">32.7</text>
    <text x="614" y="357" text-anchor="end" font-weight="700" fill="#155e75">Splaude</text>
    <rect x="622" y="344" width="217.7" height="16" rx="3" fill="#0e7490"/><text x="846" y="357" font-weight="700" fill="#155e75">29.3</text>
  </g>

  <text x="20" y="404" font-size="11" fill="#4b5563">Measured on an M4 Pro with 48 GB: Qwen3.8-27B UD-Q4_K_XL, the same GGUF file on both engines; llama.cpp b11493 vs Splash 1.4.0.</text>
  <text x="20" y="420" font-size="11" fill="#4b5563">Details: docs/claude-code-benchmarks.md</text>
</svg>
