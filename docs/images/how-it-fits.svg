    <rect x="444" y="302" width="26" height="68" fill="url(#vhatch)" stroke-width="0.8"/>
    <rect x="474" y="302" width="26" height="68" fill="url(#vhatch)" stroke-width="0.8"/>
    <rect x="504" y="302" width="26" height="68" fill="url(#vhatch)" stroke-width="0.8"/>
