  <text x="477" y="211" font-size="11" font-weight="700" fill="#155e75">~350 s</text>
  <rect x="376" y="220" width="218" height="18" rx="3" fill="#eef0f3"/>
  <rect x="376" y="220" width="212.6" height="18" rx="3" fill="#b8bec7"/>
  <text x="382" y="233" font-size="11" fill="#1f2937">llama.cpp</text>
  <text x="584" y="233" text-anchor="end" font-size="11" fill="#1f2937">~780 s</text>
  <line x1="485" y1="248" x2="485" y2="262" stroke="#0e7490" stroke-width="2"/>

