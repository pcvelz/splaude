  <text x="376" y="34" font-size="11" font-weight="800" letter-spacing="1.2" fill="#155e75">SPLAUDE</text>
  <text x="376" y="70"><tspan font-size="14" font-weight="700" fill="#155e75">up to </tspan><tspan font-size="34" font-weight="800" fill="#0e7490">2.9x</tspan><tspan font-size="17" font-weight="800" fill="#155e75"> faster</tspan></text>
  <text x="376" y="88" font-size="11.5" fill="#374151">prose decode, 2k-60k context</text>
  <rect x="376" y="96" width="218" height="18" rx="3" fill="#eef0f3"/>
  <rect x="376" y="96" width="213.6" height="18" rx="3" fill="#0e7490"/>
  <text x="382" y="109" font-size="11" font-weight="700" fill="#ffffff">Splaude</text>
  <text x="586" y="109" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">29.4 tok/s at 2k</text>
  <rect x="376" y="118" width="218" height="18" rx="3" fill="#eef0f3"/>
  <rect x="376" y="118" width="74.8" height="18" rx="3" fill="#b8bec7"/>
  <text x="382" y="131" font-size="11" fill="#1f2937">llama.cpp</text>
