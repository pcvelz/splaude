  <text x="376" y="172"><tspan font-size="30" font-weight="800" fill="#0e7490">~350 s</tspan><tspan font-size="13" font-weight="700" fill="#155e75"> cold 60k prompt</tspan></text>
  <text x="376" y="190" font-size="11.5" fill="#374151">seconds, shorter is better</text>
  <rect x="376" y="198" width="218" height="18" rx="3" fill="#eef0f3"/>
  <rect x="376" y="198" width="95.4" height="18" rx="3" fill="#0e7490"/>
