  <text x="297" y="405" text-anchor="middle" font-size="21" font-weight="800" fill="#0e7490">1.8-3.2 s</text>
  <text x="297" y="422" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155e75">first token,</text>
  <text x="297" y="436" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155e75">warm turns</text>

