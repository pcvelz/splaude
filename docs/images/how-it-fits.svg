  <text class="mono" xml:space="preserve" x="32" y="369" font-size="11.5"><tspan fill="#a8a29e">tool loop </tspan><tspan fill="#f5f4ef">Read Edit Bash</tspan></text>
  <text class="mono" xml:space="preserve" x="32" y="391" font-size="11.5"><tspan fill="#a8a29e">hooks     </tspan><tspan fill="#f5f4ef">every tool call</tspan></text>
  <text class="mono" xml:space="preserve" x="32" y="413" font-size="11.5"><tspan fill="#a8a29e">subagents </tspan><tspan fill="#f5f4ef">in parallel</tspan></text>
  <text class="mono" xml:space="preserve" x="32" y="445" font-size="12"><tspan fill="#f0a07f">&gt;</tspan><tspan fill="#f5f4ef"> _</tspan></text>

