<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="hif-title hif-desc">
  <title id="hif-title">How Splaude fits: Claude Code to Splaude to the supported models</title>
  <desc id="hif-desc">Claude Code, drawn as a terminal window with its tool loop, hooks and subagents, connects through the Anthropic Messages API to Splaude, with 1.8 to 3.2 seconds to first token on warm turns. Splaude is drawn as a die in teal line art: Claude Code options as an orange strip on the side facing Claude Code, DFlash2 decoding as tiles across the top, Metal kernels as a grid of small tiles and SSD expert streaming as nested blocks. Above it, the Splaude claims: up to 2.9 times faster prose decode at 2k to 60k context, bars Splaude 29.4 against plain llama.cpp 10.3 tokens per second at 2k; cold 60k-token prompt, shorter is better, Splaude about 350 seconds against llama.cpp about 780 seconds. Directly below Splaude, in grey with no connections, llama.cpp as the comparison reference only. The six models are bubbles whose area is total parameters with a solid core for the parameters active per token: Qwen3.8-27B 27B dense; Qwen3.6-35B-A3B 35B total, 3B active; Ornith-1.5-122B 122B, active count not listed; Qwen3.8-Flash-Next 125B total, 6B active; Flint 39.8B total, about 2.5B active; Ternary Bonsai 2 27B dense.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
    text.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="360" y1="262" x2="610" y2="492">
      <stop offset="0" stop-color="#0ea5c6"/>
      <stop offset="1" stop-color="#7ff3ff"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="vhatch" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="2" y1="0" x2="2" y2="4" stroke="#2cc3d9" stroke-width="0.7"/></pattern>
    <pattern id="hhatch" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="2" x2="4" y2="2" stroke="#2cc3d9" stroke-width="0.7"/></pattern>
    <pattern id="ohatch" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="2" x2="4" y2="2" stroke="#e8875f" stroke-width="0.7"/></pattern>
    <pattern id="gpu" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#4dd9ec" stroke-width="0.6"/><rect x="3.5" y="3.5" width="5" height="2.5" fill="none" stroke="#4dd9ec" stroke-width="0.4"/><line x1="3.5" y1="8" x2="8.5" y2="8" stroke="#4dd9ec" stroke-width="0.4"/></pattern>
  </defs>
